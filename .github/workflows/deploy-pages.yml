name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Mapbox token into index.html
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          TOKEN="$MAPBOX_ACCESS_TOKEN"
          if [ -z "$TOKEN" ]; then TOKEN="$MAPBOX_TOKEN"; fi
          if [ -z "$TOKEN" ]; then
            echo "Add MAPBOX_ACCESS_TOKEN (or MAPBOX_TOKEN) under Settings → Secrets and variables → Actions."
            exit 1
          fi
          export TOKEN
          python3 <<'PY'
          import os
          import re
          token = os.environ["TOKEN"]
          path = "index.html"
          html = open(path, encoding="utf-8").read()
          pattern = r"window\.MAPBOX_ACCESS_TOKEN='';"
          replacement = "window.MAPBOX_ACCESS_TOKEN='" + token.replace("\\", "\\\\").replace("'", "\\'") + "';"
          html, count = re.subn(pattern, replacement, html, count=1)
          if count != 1:
            raise SystemExit("Could not find Mapbox token placeholder in index.html")
          open(path, "w", encoding="utf-8").write(html)
          PY

      - name: Verify Mapbox token injection
        run: grep -q "MAPBOX_ACCESS_TOKEN='pk\\." index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
